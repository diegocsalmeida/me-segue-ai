<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Me Segue Aí - Acompanhamento em Tempo Real</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f9; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        .top-banner {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; z-index: 1000;
            background: rgba(63, 81, 181, 0.95); color: white; padding: 12px 20px;
            border-radius: 50px; text-align: center; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }

        .top-banner b { cursor: pointer; text-decoration: underline; }

        .info-box {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 400px; z-index: 1000;
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .btn-open-app {
            display: block; width: 100%; padding: 12px; margin-top: 15px;
            background: #3F51B5; color: white; border: none; border-radius: 12px;
            font-weight: bold; font-size: 16px; cursor: pointer; text-align: center;
            text-decoration: none; box-shadow: 0 4px 10px rgba(63, 81, 181, 0.3);
        }

        .panic {
            background: #ff5252 !important;
            color: white !important;
            animation: pulse 1.5s infinite;
            border: 2px solid white;
        }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.02); box-shadow: 0 0 20px rgba(255, 82, 82, 0.6); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .status-dot {
            height: 10px; width: 10px; background-color: #4CAF50;
            border-radius: 50%; display: inline-block; margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="top-banner" id="banner">
    <span>Para uma experiência melhor, abra no App.</span>
    <b onclick="tryOpenApp()">ABRIR APP</b>
</div>

<div id="map"></div>

<div class="info-box" id="info">
    <div style="text-align: center;">
        <b>Buscando conexão...</b><br>
        <small>Certifique-se que o link está correto.</small>
    </div>
</div>

<!-- Firebase App -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyATG3nxeQV6G_wvNAUCjDtpr5w1LOIoV-c",
        authDomain: "mesegueai-998f1.firebaseapp.com",
        databaseURL: "https://mesegueai-998f1-default-rtdb.firebaseio.com",
        projectId: "mesegueai-998f1",
        storageBucket: "mesegueai-998f1.firebasestorage.app",
        messagingSenderId: "134737336446",
        appId: "1:134737336446:web:8b937fc9b3b404721da02f",
        measurementId: "G-88B2L81TNP"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('id');

    function tryOpenApp() {
        if (targetUid) {
            window.location.href = "mesegueai://acompanhar?id=" + targetUid;
            console.log("Tentando redirecionar para o aplicativo...");
        }
    }

    setTimeout(tryOpenApp, 500);

    const map = L.map('map', { zoomControl: false });

    // ESRI World Gray Canvas - Gratuito, limpo e sem API Key
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
        maxZoom: 16
    }).addTo(map);

    let marker = null;

    if (targetUid) {
        const locationRef = database.ref('locations/' + targetUid);
        const userRef = database.ref('users/' + targetUid);

        let userName = "Usuário";
        userRef.once('value').then((snapshot) => {
            if (snapshot.exists()) userName = snapshot.val().name;
        });

        locationRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const pos = [data.latitude, data.longitude];

                if (!marker) {
                    marker = L.marker(pos).addTo(map);
                    map.setView(pos, 16);
                } else {
                    marker.setLatLng(pos);
                    if (data.isPanic) {
                        map.panTo(pos);
                    }
                }

                const infoDiv = document.getElementById('info');
                const bat = data.batteryLevel >= 0 ? `🔋 ${data.batteryLevel}%` : "";
                const panicClass = data.isPanic ? "panic" : "";
                const time = new Date(data.timestamp).toLocaleTimeString();

                infoDiv.className = "info-box " + panicClass;
                infoDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 18px; font-weight: bold;">${userName}</span>
                        <span style="font-size: 14px;">${bat}</span>
                    </div>
                    <div style="margin-top: 5px; font-size: 14px; opacity: 0.9;">
                        ${data.isPanic ? "<b>⚠️ ALERTA DE PÂNICO ATIVADO!</b>" : "<span class='status-dot'></span> Localização em tempo real"}
                    </div>
                    <div style="margin-top: 10px; font-size: 12px; opacity: 0.7;">
                        Última atualização: ${time}
                    </div>
                    <a href="javascript:void(0)" onclick="tryOpenApp()" class="btn-open-app">ABRIR NO APLICATIVO</a>
                `;
            }
        });
    } else {
        document.getElementById('info').innerHTML = "<b>ID não encontrado.</b><br>Verifique o link enviado.";
    }
</script>

</body>
</html>
